name: Check LFP PWA

on:
  pull_request:
    paths:
      - "pwa-gas-src/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build the PWA
        run: |
          node pwa-gas-src/test.mjs
          node pwa-gas-src/build-root.mjs _site
          node pwa-gas-src/test.mjs _site/pwa-gas
          node pwa-gas-src/test-root.mjs _site
