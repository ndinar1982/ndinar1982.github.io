name: Check isolated LFP PWA install preview (no deployment)

on:
  push:
    branches: [lfp-pwa-install-test-20261121]
  pull_request:
    paths:
      - "pwa-preview-src/**"
      - ".github/workflows/publish-lfp.yml"
      - ".github/workflows/check-pwa-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and manifest checks (no network finance data)
        run: |
          node --check pwa-preview-src/sw.js
          node --check pwa-preview-src/install-ui.js
          node --check pwa-preview-src/test-preview.mjs
          node pwa-preview-src/test-preview.mjs
      - name: Confirm no changes to production root files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git diff --name-only origin/main...HEAD | tee /tmp/changed.txt
          if grep -E '^(index\.html|health\.html|lfp-about\.html|lfp-privacy\.html|README\.md)$' /tmp/changed.txt; then
            echo "Production pages were unexpectedly changed"
            exit 1
          fi
          echo "PASS: existing root deployment content unchanged; preview not deployed"

      - name: Inspect actual public GitHub Pages routes (safe GET only)
        shell: bash
        run: |
          set -euo pipefail
          for page in health.html index.html pwa-preview/ pwa-preview/manifest.webmanifest pwa-preview/install-help.html pwa-preview/sw.js; do
            tmp="/tmp/lfp-live-${page//\//_}"
            status="$(curl -L -sS --connect-timeout 15 --max-time 25 -w '%{http_code}' "https://ndinar1982.github.io/$page" -o "$tmp" || true)"
            bytes="$(wc -c < "$tmp" 2>/dev/null || echo missing)"
            echo "PATH: $page | HTTP: $status | bytes: $bytes"
            if [[ "$page" == "health.html" ]] || [[ "$page" == "index.html" ]] || [[ "$page" == "pwa-preview/" ]]; then
              grep -Eo 'Тест доступности без VPN|v9\.68 Firebase|v9\.68 · PWA тест|PWA v9\.68|ЛФП — проверка' "$tmp" | head -n 5 || true
            fi
          done
