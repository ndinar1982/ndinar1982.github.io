name: Publish LFP PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lfp-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      - name: Build root PWA
        run: |
          node pwa-gas-src/test.mjs
          node pwa-gas-src/build-root.mjs _site
          node pwa-gas-src/test-root.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the PWA
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify root PWA and removed legacy route
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ndinar1982.github.io"
          passed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$BASE/index.html" -o /tmp/lfp-root.html \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$BASE/manifest.webmanifest" -o /tmp/lfp-root-manifest.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$BASE/sw.js" -o /tmp/lfp-root-sw.js \
              && grep -Fq 'id="budget-frame"' /tmp/lfp-root.html \
              && grep -Fq 'src="./app.js?v=972"' /tmp/lfp-root.html \
              && grep -Fq "const CACHE='lfp-gas-iframe-root-v972'" /tmp/lfp-root-sw.js; then
              passed=1
              break
            fi
            echo "Pages CDN updating (attempt $attempt)"
            sleep 4
          done
          test "$passed" -eq 1
          python3 - <<'PY'
          import json
          with open('/tmp/lfp-root-manifest.json',encoding='utf-8') as handle:
              m=json.load(handle)
          assert m['id']==m['start_url']==m['scope']=='/'
          assert m['display']=='standalone'
          assert {'192x192','512x512'}.issubset({icon['sizes'] for icon in m['icons']})
          print('PASS: only root PWA is published')
          PY
          status=$(curl -sL -o /dev/null -w '%{http_code}' "$BASE/pwa-gas/")
          test "$status" = "404"
